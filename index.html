<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>API Hub</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  background: #0e0e0e;
  font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
  color: white;
  display: flex;
  flex-direction: column;
  height: 100vh;
}

header {
  padding: 20px;
  font-size: 20px;
  font-weight: 600;
  border-bottom: 1px solid #222;
  background: #111;
}

#providers {
  display: flex;
  gap: 10px;
  padding: 15px;
  border-bottom: 1px solid #222;
}

.provider-btn {
  padding: 8px 14px;
  border-radius: 6px;
  border: 1px solid #333;
  background: #1a1a1a;
  color: white;
  cursor: pointer;
  transition: 0.2s;
}

.provider-btn.active {
  background: #2affb0;
  color: black;
  border-color: #2affb0;
}

#chat {
  flex: 1;
  overflow-y: auto;
  padding: 20px;
  white-space: pre-wrap;
}

.message {
  margin-bottom: 15px;
}

.user {
  color: #2affb0;
}

.ai {
  color: #ccc;
}

#inputBar {
  display: flex;
  border-top: 1px solid #222;
  padding: 10px;
  gap: 10px;
}

#input {
  flex: 1;
  padding: 10px;
  background: #1a1a1a;
  border: 1px solid #333;
  border-radius: 6px;
  color: white;
  outline: none;
}

#send {
  padding: 10px 16px;
  background: #2affb0;
  border: none;
  border-radius: 6px;
  cursor: pointer;
  font-weight: 600;
}
</style>
</head>

<body>

<header>API Console</header>

<div id="providers">
  <button class="provider-btn active" data-provider="claude">claude:</button>
  <button class="provider-btn" data-provider="grok">grok:</button>
  <button class="provider-btn" data-provider="google">google:</button>
</div>

<div id="chat"></div>

<div id="inputBar">
  <input id="input" placeholder="Type prompt..." />
  <button id="send">Send</button>
</div>

<script>
let currentProvider = "claude";

const buttons = document.querySelectorAll(".provider-btn");
buttons.forEach(btn => {
  btn.addEventListener("click", () => {
    buttons.forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    currentProvider = btn.dataset.provider;
  });
});

const chat = document.getElementById("chat");

function addMessage(text, role) {
  const div = document.createElement("div");
  div.className = `message ${role}`;
  div.textContent = text;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

document.getElementById("send").addEventListener("click", async () => {
  const input = document.getElementById("input");
  const prompt = input.value.trim();
  if (!prompt) return;

  addMessage("You: " + prompt, "user");
  input.value = "";

  addMessage("Thinking (" + currentProvider + ")...", "ai");

  try {
    const response = await fetch("/api/" + currentProvider, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ prompt })
    });

    const data = await response.json();

    chat.lastChild.textContent = currentProvider + ": " + data.reply;

  } catch (err) {
    chat.lastChild.textContent = "Error calling " + currentProvider;
  }
});
</script>

</body>
</html>
